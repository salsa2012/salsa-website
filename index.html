<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salsa World 🎀</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fff0f5;
    font-family: Georgia, serif;
    color: #bd6685;
    text-align: center;
    overflow-x: hidden;
    min-height: 100vh;
}

/* BACKGROUND */

body::before {
    content: "🎀";
    position: fixed;
    top: 15px;
    left: 20px;
    font-size: 45px;
    opacity: 0.7;
}

body::after {
    content: "🎀";
    position: fixed;
    bottom: 15px;
    right: 20px;
    font-size: 45px;
    opacity: 0.7;
}

/* FLOATING DECORATIONS */

.decoration {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    animation: float 5s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0) rotate(-10deg); }
    50% { transform: translateY(-20px) rotate(10deg); }
}

/* FAIRY */

.fairy {
    position: fixed;
    font-size: 42px;
    z-index: 5;
    animation: fly 12s linear infinite;
    pointer-events: none;
}

@keyframes fly {
    0% {
        top: 15%;
        left: -60px;
        transform: rotate(10deg);
    }
    25% {
        top: 30%;
        left: 35%;
        transform: rotate(-10deg);
    }
    50% {
        top: 10%;
        left: 75%;
        transform: rotate(15deg);
    }
    75% {
        top: 45%;
        left: 55%;
        transform: rotate(-15deg);
    }
    100% {
        top: 15%;
        left: 110%;
        transform: rotate(10deg);
    }
}

/* MAIN */

.container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
}

h1 {
    font-size: 43px;
    margin-bottom: 15px;
    color: #d77f9e;
}

.subtitle {
    font-size: 17px;
    margin-bottom: 30px;
    font-style: italic;
}

button {
    background: #e99ab6;
    color: white;
    border: 2px solid white;
    border-radius: 30px;
    padding: 13px 28px;
    font-size: 15px;
    cursor: pointer;
    font-family: Georgia, serif;
    transition: 0.3s;
}

button:hover {
    background: #d77f9e;
    transform: scale(1.06);
}

/* PAGE */

.page {
    display: none;
    animation: appear 1s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* HEARTS */

.heart {
    position: fixed;
    bottom: -30px;
    z-index: 10;
    pointer-events: none;
    animation: heartFly 4s linear forwards;
}

@keyframes heartFly {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* INPUT */

input {
    padding: 13px;
    width: 250px;
    max-width: 90%;
    border: 2px solid #f1b6ca;
    border-radius: 25px;
    outline: none;
    text-align: center;
    font-size: 15px;
    margin: 20px 0;
    color: #bd6685;
    background: white;
}

input::placeholder {
    color: #d9a0b5;
}

/* ENVELOPE */

.envelope {
    font-size: 100px;
    cursor: pointer;
    margin: 25px;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

/* LETTER */

.letter {
    display: none;
    background: #fffafc;
    border: 2px dashed #e8a2ba;
    border-radius: 15px;
    padding: 30px 20px;
    max-width: 340px;
    width: 90%;
    margin: 20px auto;
    line-height: 1.9;
    box-shadow: 0 5px 20px #e8b4c755;
    animation: appear 1s ease;
}

.letter h2 {
    margin-bottom: 15px;
    color: #d77f9e;
}

.letter p {
    font-size: 16px;
}

.small {
    margin-top: 20px;
    font-size: 13px;
    font-style: italic;
}

/* SPARKLES */

.sparkle {
    position: fixed;
    pointer-events: none;
    animation: sparkle 2s infinite alternate;
}

@keyframes sparkle {
    from { opacity: 0.3; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1.3); }
}

</style>
</head>

<body>

<!-- DECORATIONS -->

<div class="fairy">🧚🏻‍♀️</div>

<div class="decoration" style="top:20%;left:8%">🎀</div>
<div class="decoration" style="top:70%;left:12%">💗</div>
<div class="decoration" style="top:25%;right:10%">🎀</div>
<div class="decoration" style="bottom:15%;right:12%">🦋</div>

<div class="sparkle" style="top:15%;left:45%">✧</div>
<div class="sparkle" style="top:65%;right:20%">✦</div>
<div class="sparkle" style="bottom:25%;left:30%">✧</div>
<div class="sparkle" style="top:40%;right:35%">✨</div>


<!-- OPENING -->

<div class="container">

    <div id="opening" class="page" style="display:block">

        <h1>Salsa World ♡</h1>

        <p class="subtitle">
            Welcome to my website, guys!
        </p>

        <button onclick="startWebsite()">
            Click here! ♡
        </button>

        <p class="small">
            a little world made with love 🎀
        </p>

    </div>


    <!-- NAME PAGE -->

    <div id="namePage" class="page">

        <h1>Hello, you! ♡</h1>

        <p class="subtitle">
            Before we continue, may I know your name?
        </p>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter your name..."
        >

        <br>

        <button onclick="checkName()">
            Submit ♡
        </button>

        <p id="error" style="margin-top:20px"></p>

    </div>


    <!-- ENVELOPE PAGE -->

    <div id="envelopePage" class="page">

        <h1>A little letter for you 💌</h1>

        <p class="subtitle">
            Someone has prepared something for you...
        </p>

        <div class="envelope" onclick="openLetter()">
            💌
        </div>

        <p>Click the envelope! ♡</p>

        <div class="letter" id="letter">

            <h2>♡ A Letter For You ♡</h2>

            <p id="letterContent"></p>

            <p class="small">
                with love, Salsa 💗
            </p>

        </div>

    </div>

</div>


<script>

// PAGE SWITCH

function showPage(pageId) {

    document.querySelectorAll(".page").forEach(page => {
        page.style.display = "none";
    });

    document.getElementById(pageId).style.display = "block";

}


// HEART ANIMATION

function createHearts() {

    let hearts = ["💗", "💕", "💖", "💘", "♡", "🎀"];

    for (let i = 0; i < 45; i++) {

        let heart = document.createElement("div");

        heart.className = "heart";

        heart.innerHTML =
            hearts[Math.floor(Math.random() * hearts.length)];

        heart.style.left = Math.random() * 100 + "vw";

        heart.style.fontSize =
            (15 + Math.random() * 25) + "px";

        heart.style.animationDuration =
            (3 + Math.random() * 3) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 6500);

    }

}


// START

function startWebsite() {

    createHearts();

    setTimeout(() => {
        showPage("namePage");
    }, 2500);

}


// FRIEND LETTERS

const letters = {

    "nurul": `
        hii nuy, akuu bikin website for you!
        terimakasih udah jadi temen terbaik aku yaaa,
        love youu 💖🌷
    `,

    "anida": `
        hii anida, aku bikin website for you!
        makasii udh jadi my pren yah, hehe 💖🌷
    `,

    "zahratul fitriah": `
        hii ipit, aku bikin website for you!
        btw km kembaran Chiquita wkwk💖🌷
    `

};


// CHECK NAME

let selectedLetter = "";

function checkName() {

    let name = document
        .getElementById("nameInput")
        .value
        .trim()
        .toLowerCase();

    let error = document.getElementById("error");

    if (letters[name]) {

        selectedLetter = letters[name];

        error.innerHTML = "";

        createHearts();

        setTimeout(() => {
            showPage("envelopePage");
        }, 1000);

    } else {

        error.innerHTML =
            "Oops! Name not found. Try again, please! 🎀";

    }

}


// OPEN LETTER

function openLetter() {

    let letter = document.getElementById("letter");

    document.getElementById("letterContent").innerHTML =
        selectedLetter;

    letter.style.display = "block";

    createHearts();

}

</script>

</body>
  </html>
